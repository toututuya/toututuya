<svg xmlns="http://www.w3.org/2000/svg" width="760" height="298" viewBox="0 0 760 298" role="img" aria-labelledby="title desc">
  <title id="title">DualDA research card</title>
  <desc id="desc">A fresh atmospheric research card showing first-author results for DualDA.</desc>
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#FCFEFF"/><stop offset=".55" stop-color="#F4F9FF"/><stop offset="1" stop-color="#EEF8FC"/></linearGradient>
    <radialGradient id="sky"><stop stop-color="#CFE7FF" stop-opacity=".74"/><stop offset="1" stop-color="#CFE7FF" stop-opacity="0"/></radialGradient>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#93B6CE" stroke-opacity=".1"/></pattern>
  </defs>
  <rect width="760" height="298" rx="26" fill="url(#paper)"/><rect x=".75" y=".75" width="758.5" height="296.5" rx="25.25" fill="none" stroke="#DCE8F1" stroke-width="1.5"/>
  <circle cx="658" cy="62" r="165" fill="url(#sky)"/><rect x="415" width="345" height="298" fill="url(#grid)" opacity=".7"/>

  <g opacity=".45" fill="none" stroke-linecap="round"><path d="M421 54C480 25 552 36 597 67S690 100 742 70" stroke="#7CBDE5" stroke-width="1.4"/><path d="M406 93C472 65 535 78 581 111S680 143 741 109" stroke="#83ABD7" stroke-width="1.2"/><path d="M424 142C487 116 552 129 598 162S686 193 742 164" stroke="#6FCACF" stroke-width="1.3"/><path d="M411 195C474 166 542 181 589 218S681 248 742 215" stroke="#79B8E7" stroke-width="1.2"/></g>

  <g font-family="Segoe UI,Arial,sans-serif">
    <rect x="42" y="34" width="42" height="42" rx="13" fill="#FFFFFF" stroke="#CFE0EE"/>
    <path d="M52 58C54 50 61 47 67 51C72 46 80 50 80 57C80 63 76 66 70 66H58C53 66 50 63 52 58Z" fill="none" stroke="#5B9FD2" stroke-width="1.8"/>
    <text x="98" y="61" fill="#1E425D" font-size="27" font-weight="750">DualDA</text>
    <text x="42" y="104" fill="#558BB5" font-size="11.5" font-weight="700" letter-spacing="1.7">GENERATIVE ATMOSPHERIC ANALYSIS</text>
    <text x="42" y="141" fill="#476274" font-size="15.5">First-author research on 69-variable global fields,</text><text x="42" y="165" fill="#476274" font-size="15.5">coupling latent analysis with conditional diffusion.</text>
  </g>

  <g font-family="Segoe UI,Arial,sans-serif">
    <rect x="42" y="198" width="182" height="62" rx="15" fill="#FFFFFF" fill-opacity=".78" stroke="#D6E5EF"/><text x="58" y="220" fill="#7691A5" font-size="9.5" font-weight="700" letter-spacing="1">BEST NRMSE</text><text x="58" y="247" fill="#1C405A" font-size="23" font-weight="750">0.1178</text>
    <rect x="236" y="198" width="182" height="62" rx="15" fill="#FFFFFF" fill-opacity=".78" stroke="#D6E5EF"/><text x="252" y="220" fill="#7691A5" font-size="9.5" font-weight="700" letter-spacing="1">VERSUS FNP</text><text x="252" y="247" fill="#1C405A" font-size="23" font-weight="750">4.5% lower</text>
    <rect x="430" y="198" width="288" height="62" rx="15" fill="#FFFFFF" fill-opacity=".78" stroke="#D6E5EF"/><text x="446" y="220" fill="#7691A5" font-size="9.5" font-weight="700" letter-spacing="1">PAPER STATUS</text><text x="446" y="247" fill="#1C405A" font-size="20" font-weight="750">AAAI 2027 · Under Review</text>
  </g>
</svg>
