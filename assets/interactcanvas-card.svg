<svg xmlns="http://www.w3.org/2000/svg" width="760" height="520" viewBox="0 0 760 520" role="img" aria-labelledby="title desc">
  <title id="title">InteractCanvas project card</title>
  <desc id="desc">A translucent project card over a human-object interaction layout editor background.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070B16"/>
      <stop offset="0.58" stop-color="#11152A"/>
      <stop offset="1" stop-color="#26182A"/>
    </linearGradient>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M30 0H0V30" fill="none" stroke="#A9B5D0" stroke-opacity=".08"/>
    </pattern>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#0C1222" stop-opacity=".95"/>
      <stop offset="1" stop-color="#11172A" stop-opacity=".86"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#000" flood-opacity=".42"/>
    </filter>
  </defs>
  <rect width="760" height="520" rx="28" fill="url(#bg)"/>
  <rect width="760" height="520" rx="28" fill="url(#grid)"/>

  <g opacity=".72">
    <rect x="473" y="83" width="108" height="237" rx="9" fill="#FF6B74" fill-opacity=".08" stroke="#FF6B74" stroke-width="3"/>
    <rect x="508" y="245" width="196" height="141" rx="9" fill="#FFB04A" fill-opacity=".08" stroke="#FFB04A" stroke-width="3"/>
    <rect x="570" y="121" width="69" height="92" rx="9" fill="#5EE7F2" fill-opacity=".08" stroke="#5EE7F2" stroke-width="3"/>
    <path d="M533 216 C552 244 577 266 609 288" fill="none" stroke="#FFB04A" stroke-width="3"/>
    <path d="M548 167 C566 157 580 156 594 163" fill="none" stroke="#5EE7F2" stroke-width="3"/>
    <circle cx="533" cy="216" r="5" fill="#FF6B74"/>
    <circle cx="609" cy="288" r="5" fill="#FFB04A"/>
    <circle cx="594" cy="163" r="5" fill="#5EE7F2"/>
    <rect x="585" y="263" width="64" height="24" rx="12" fill="#271B16" stroke="#FFB04A"/>
    <text x="617" y="280" text-anchor="middle" fill="#FFD095" font-family="Segoe UI,Arial,sans-serif" font-size="12">riding</text>
    <rect x="559" y="136" width="66" height="24" rx="12" fill="#102028" stroke="#5EE7F2"/>
    <text x="592" y="153" text-anchor="middle" fill="#A8F6FB" font-family="Segoe UI,Arial,sans-serif" font-size="12">holding</text>
  </g>

  <rect x="30" y="28" width="700" height="464" rx="24" fill="url(#panel)" stroke="#FFFFFF" stroke-opacity=".12" filter="url(#shadow)"/>

  <g transform="translate(62 58)">
    <rect width="46" height="46" rx="13" fill="#1A2035" stroke="#FF7A82" stroke-opacity=".65"/>
    <rect x="9" y="9" width="12" height="28" rx="3" fill="none" stroke="#FF7A82" stroke-width="2"/>
    <rect x="25" y="20" width="13" height="17" rx="3" fill="none" stroke="#FFB04A" stroke-width="2"/>
    <path d="M20 18C26 17 28 20 31 24" fill="none" stroke="#72EAF2" stroke-width="2"/>
  </g>
  <text x="122" y="83" fill="#FFFFFF" font-family="Segoe UI,Arial,sans-serif" font-size="30" font-weight="700">InteractCanvas</text>
  <text x="62" y="132" fill="#FFB4B9" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="600" letter-spacing=".7">LAYOUT-GUIDED HUMAN–OBJECT INTERACTION GENERATION</text>
  <text x="62" y="172" fill="#D7DEEF" font-family="Segoe UI,Arial,sans-serif" font-size="17">Editable boxes and action relations become structured conditions</text>
  <text x="62" y="196" fill="#D7DEEF" font-family="Segoe UI,Arial,sans-serif" font-size="17">for local InteractDiffusion inference.</text>

  <g fill="#EEF2FF" font-family="Segoe UI,Arial,sans-serif" font-size="16">
    <circle cx="68" cy="244" r="4" fill="#FF7A82"/><text x="84" y="250">Drag, resize, and validate subject / object boxes</text>
    <circle cx="68" cy="282" r="4" fill="#FFB04A"/><text x="84" y="288">One subject, multiple objects, independent actions</text>
    <circle cx="68" cy="320" r="4" fill="#72EAF2"/><text x="84" y="326">Vue 3 + Flask asynchronous generation pipeline</text>
    <circle cx="68" cy="358" r="4" fill="#A98BFF"/><text x="84" y="364">Diffusers / PEFT LoRA; CPU-verified at 512 × 512</text>
  </g>

  <rect x="62" y="413" width="257" height="45" rx="22.5" fill="#FF6873"/>
  <text x="190.5" y="442" text-anchor="middle" fill="#FFFFFF" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="700">Repository &amp; runnable demo  →</text>
</svg>
