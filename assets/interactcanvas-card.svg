<svg xmlns="http://www.w3.org/2000/svg" width="760" height="352" viewBox="0 0 760 352" role="img" aria-labelledby="title desc">
  <title id="title">InteractCanvas project card</title>
  <desc id="desc">A light editorial card for a layout-guided human-object interaction generation system.</desc>
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#FFFDFC"/><stop offset=".55" stop-color="#FAFCFF"/><stop offset="1" stop-color="#F1FBFC"/></linearGradient>
    <radialGradient id="coral"><stop stop-color="#FFD9D8" stop-opacity=".72"/><stop offset="1" stop-color="#FFD9D8" stop-opacity="0"/></radialGradient>
    <radialGradient id="cyan"><stop stop-color="#CFF3F6" stop-opacity=".8"/><stop offset="1" stop-color="#CFF3F6" stop-opacity="0"/></radialGradient>
    <pattern id="grid" width="22" height="22" patternUnits="userSpaceOnUse"><path d="M22 0H0V22" fill="none" stroke="#AFC2D0" stroke-opacity=".15"/></pattern>
  </defs>
  <rect width="760" height="352" rx="26" fill="url(#paper)"/><rect x=".75" y=".75" width="758.5" height="350.5" rx="25.25" fill="none" stroke="#E1EAF0" stroke-width="1.5"/>
  <circle cx="100" cy="52" r="130" fill="url(#coral)"/><circle cx="665" cy="294" r="150" fill="url(#cyan)"/>

  <g font-family="Segoe UI,Arial,sans-serif">
    <rect x="42" y="35" width="42" height="42" rx="13" fill="#FFFFFF" stroke="#F0D6D9"/>
    <rect x="52" y="45" width="10" height="22" rx="3" fill="none" stroke="#F08187" stroke-width="1.8"/><rect x="66" y="54" width="10" height="13" rx="3" fill="none" stroke="#EDA84A" stroke-width="1.8"/><path d="M61 51C66 50 68 53 70 56" fill="none" stroke="#56BCCB" stroke-width="1.7"/>
    <text x="98" y="61" fill="#20384A" font-size="27" font-weight="750">InteractCanvas</text>
    <text x="42" y="104" fill="#CE6F76" font-size="11.5" font-weight="700" letter-spacing="1.8">CONTROLLABLE HUMAN–OBJECT INTERACTION</text>
    <text x="42" y="141" fill="#3F5667" font-size="15.5">Turn editable boxes and action relations into</text><text x="42" y="165" fill="#3F5667" font-size="15.5">structured InteractDiffusion conditions.</text>

    <circle cx="48" cy="205" r="4" fill="#F08187"/><text x="62" y="211" fill="#496171" font-size="14">Drag and resize subject / object boxes</text>
    <circle cx="48" cy="237" r="4" fill="#EFA94F"/><text x="62" y="243" fill="#496171" font-size="14">Model one-to-many actions independently</text>
    <circle cx="48" cy="269" r="4" fill="#61C3CF"/><text x="62" y="275" fill="#496171" font-size="14">Run local 512 × 512 Diffusers inference</text>

    <rect x="42" y="299" width="184" height="34" rx="17" fill="#FFF0F0" stroke="#F3C8CA"/>
    <text x="134" y="321" text-anchor="middle" fill="#B95760" font-size="13" font-weight="700">Repository &amp; demo  →</text>
  </g>

  <g transform="translate(404 42)">
    <rect width="310" height="267" rx="20" fill="#FFFFFF" fill-opacity=".74" stroke="#DCE8EE"/>
    <rect x="14" y="14" width="282" height="239" rx="14" fill="#F8FBFD"/><rect x="14" y="14" width="282" height="239" rx="14" fill="url(#grid)"/>
    <circle cx="29" cy="29" r="3.5" fill="#F18487"/><circle cx="40" cy="29" r="3.5" fill="#F2BE6B"/><circle cx="51" cy="29" r="3.5" fill="#79CFD8"/>
    <text x="230" y="33" fill="#93A6B4" font-family="Segoe UI,Arial,sans-serif" font-size="8" letter-spacing="1">512 × 512</text>

    <rect x="53" y="58" width="86" height="144" rx="7" fill="#FFF5F5" fill-opacity=".8" stroke="#F08187" stroke-width="2"/>
    <rect x="103" y="141" width="148" height="76" rx="7" fill="#FFF9EF" fill-opacity=".8" stroke="#EDA84A" stroke-width="2"/>
    <rect x="174" y="70" width="58" height="70" rx="7" fill="#F1FCFD" fill-opacity=".9" stroke="#56BCCB" stroke-width="2"/>
    <path d="M119 115C143 103 159 102 183 106" fill="none" stroke="#56BCCB" stroke-width="2" stroke-dasharray="4 4"/><path d="M119 151C146 168 164 172 192 178" fill="none" stroke="#EDA84A" stroke-width="2" stroke-dasharray="4 4"/>
    <rect x="146" y="92" width="54" height="21" rx="10.5" fill="#E8F9FB" stroke="#9DDEE5"/><text x="173" y="106" text-anchor="middle" fill="#3B929E" font-family="Segoe UI,Arial,sans-serif" font-size="9" font-weight="700">holding</text>
    <rect x="151" y="160" width="49" height="21" rx="10.5" fill="#FFF2DE" stroke="#F3CB8E"/><text x="175.5" y="174" text-anchor="middle" fill="#B87922" font-family="Segoe UI,Arial,sans-serif" font-size="9" font-weight="700">riding</text>
    <text x="63" y="75" fill="#B9565E" font-family="Segoe UI,Arial,sans-serif" font-size="9" font-weight="700">SUBJECT</text><text x="111" y="158" fill="#B27624" font-family="Segoe UI,Arial,sans-serif" font-size="9" font-weight="700">BICYCLE</text><text x="183" y="87" fill="#358E99" font-family="Segoe UI,Arial,sans-serif" font-size="9" font-weight="700">CUP</text>
  </g>
</svg>
