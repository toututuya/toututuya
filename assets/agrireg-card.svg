<svg xmlns="http://www.w3.org/2000/svg" width="760" height="520" viewBox="0 0 760 520" role="img" aria-labelledby="title desc">
  <title id="title">AgriReg AI project card</title>
  <desc id="desc">A translucent project card over a green pesticide knowledge graph background.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06100D"/>
      <stop offset="0.58" stop-color="#0A1C16"/>
      <stop offset="1" stop-color="#0C3028"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop stop-color="#73FFB2" stop-opacity=".3"/>
      <stop offset="1" stop-color="#73FFB2" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" fill="none" stroke="#B4FFDB" stroke-opacity=".07"/>
    </pattern>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#071510" stop-opacity=".96"/>
      <stop offset="1" stop-color="#0B2019" stop-opacity=".87"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#000" flood-opacity=".42"/>
    </filter>
  </defs>
  <rect width="760" height="520" rx="28" fill="url(#bg)"/>
  <rect width="760" height="520" rx="28" fill="url(#grid)"/>
  <circle cx="622" cy="151" r="175" fill="url(#glow)"/>

  <g opacity=".72" stroke-linecap="round">
    <path d="M496 100L588 73L664 128L626 216L698 270L641 365L536 337L480 247L496 100Z" fill="none" stroke="#6DFFAE" stroke-width="2"/>
    <path d="M588 73L626 216L480 247M664 128L536 337M496 100L698 270" fill="none" stroke="#56DCC6" stroke-opacity=".65" stroke-width="1.5"/>
    <g fill="#102D23" stroke="#8BFFC0" stroke-width="2">
      <circle cx="496" cy="100" r="13"/><circle cx="588" cy="73" r="16"/><circle cx="664" cy="128" r="12"/>
      <circle cx="626" cy="216" r="20"/><circle cx="698" cy="270" r="12"/><circle cx="641" cy="365" r="15"/>
      <circle cx="536" cy="337" r="12"/><circle cx="480" cy="247" r="17"/>
    </g>
    <g fill="#C5FFE0" font-family="Segoe UI,Arial,sans-serif" font-size="10" text-anchor="middle">
      <text x="496" y="104">AI</text><text x="588" y="77">Crop</text><text x="664" y="132">Pest</text>
      <text x="626" y="220">KG</text><text x="698" y="274">MoA</text><text x="641" y="369">Agent</text>
      <text x="536" y="341">Risk</text><text x="480" y="251">Product</text>
    </g>
  </g>

  <rect x="30" y="28" width="700" height="464" rx="24" fill="url(#panel)" stroke="#B4FFDB" stroke-opacity=".13" filter="url(#shadow)"/>

  <g transform="translate(62 58)">
    <rect width="46" height="46" rx="13" fill="#10261E" stroke="#72FFB0" stroke-opacity=".68"/>
    <path d="M11 15L23 9L36 16L32 33L17 37L9 27Z" fill="none" stroke="#79FFB6" stroke-width="2"/>
    <path d="M23 9L17 37M36 16L9 27M11 15L32 33" fill="none" stroke="#56DCC6" stroke-width="1.6"/>
    <circle cx="23" cy="23" r="4" fill="#B2FFD5"/>
  </g>
  <text x="122" y="83" fill="#FFFFFF" font-family="Segoe UI,Arial,sans-serif" font-size="30" font-weight="700">AgriReg AI</text>
  <text x="62" y="132" fill="#9FFFC9" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="600" letter-spacing=".65">KNOWLEDGE GRAPH · GRAPHRAG · STATEFUL AGENT</text>
  <text x="62" y="172" fill="#D6EDE2" font-family="Segoe UI,Arial,sans-serif" font-size="17">A Neo4j pesticide intelligence platform for traceable retrieval,</text>
  <text x="62" y="196" fill="#D6EDE2" font-family="Segoe UI,Arial,sans-serif" font-size="17">multi-step verification, and resumable evidence reports.</text>

  <g fill="#F0FFF7" font-family="Segoe UI,Arial,sans-serif" font-size="14.5">
    <circle cx="68" cy="230" r="4" fill="#72FFB0"/><text x="84" y="235">Graph exploration, shortest paths, and product comparison</text>
    <circle cx="68" cy="259" r="4" fill="#56DCC6"/><text x="84" y="264">Spring Boot GraphRAG with numbered graph evidence</text>
    <circle cx="68" cy="288" r="4" fill="#A7FFD0"/><text x="84" y="293">FastAPI + LangGraph Thread / Run / SSE + SQLite checkpoints</text>
    <circle cx="68" cy="317" r="4" fill="#FFCF70"/><text x="84" y="322">Five controlled tools + HITL approval; no arbitrary Cypher</text>
    <circle cx="68" cy="346" r="4" fill="#92BFFF"/><text x="84" y="351">500 structural + 50 graph-consistency regression cases</text>
    <circle cx="68" cy="375" r="4" fill="#D9A8FF"/><text x="84" y="380">30-case study: GraphRAG 30/30 vs direct LLM 26/30</text>
  </g>

  <rect x="62" y="413" width="306" height="45" rx="22.5" fill="#5EFFA7"/>
  <text x="215" y="442" text-anchor="middle" fill="#062117" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="700">Repository, evaluation &amp; architecture  →</text>
</svg>
