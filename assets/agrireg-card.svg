<svg xmlns="http://www.w3.org/2000/svg" width="760" height="370" viewBox="0 0 760 370" role="img" aria-labelledby="title desc">
  <title id="title">AgriReg AI project card</title>
  <desc id="desc">A light editorial card for a pesticide knowledge graph, GraphRAG, and stateful agent system.</desc>
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#FCFFFD"/><stop offset=".56" stop-color="#F5FCF8"/><stop offset="1" stop-color="#EDF9F4"/></linearGradient>
    <radialGradient id="mint"><stop stop-color="#C9F0DC" stop-opacity=".8"/><stop offset="1" stop-color="#C9F0DC" stop-opacity="0"/></radialGradient>
    <radialGradient id="sky"><stop stop-color="#D4F1F3" stop-opacity=".72"/><stop offset="1" stop-color="#D4F1F3" stop-opacity="0"/></radialGradient>
    <pattern id="dots" width="18" height="18" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#86AB99" fill-opacity=".15"/></pattern>
  </defs>
  <rect width="760" height="370" rx="26" fill="url(#paper)"/><rect x=".75" y=".75" width="758.5" height="368.5" rx="25.25" fill="none" stroke="#DDEBE4" stroke-width="1.5"/>
  <circle cx="670" cy="82" r="170" fill="url(#mint)"/><circle cx="510" cy="320" r="135" fill="url(#sky)"/>

  <g font-family="Segoe UI,Arial,sans-serif">
    <rect x="42" y="34" width="42" height="42" rx="13" fill="#FFFFFF" stroke="#CFE7D9"/>
    <path d="M53 50L63 44L75 50L72 64L59 68L51 60Z" fill="none" stroke="#4FB987" stroke-width="1.8"/><path d="M63 44L59 68M75 50L51 60" fill="none" stroke="#73CBBB" stroke-width="1.4"/><circle cx="63" cy="56" r="3" fill="#65C497"/>
    <text x="98" y="61" fill="#163D31" font-size="27" font-weight="750">AgriReg AI</text>
    <text x="42" y="104" fill="#3B9D73" font-size="11.5" font-weight="700" letter-spacing="1.75">KNOWLEDGE GRAPH · GRAPHRAG · AGENT</text>
    <text x="42" y="141" fill="#405F53" font-size="15.5">Trace pesticide registrations, retrieve graph</text><text x="42" y="165" fill="#405F53" font-size="15.5">evidence, and resume multi-step analysis.</text>

    <circle cx="48" cy="204" r="4" fill="#58B987"/><text x="62" y="210" fill="#4B695D" font-size="14">Explore paths, neighbors, and product overlap</text>
    <circle cx="48" cy="236" r="4" fill="#63BFC3"/><text x="62" y="242" fill="#4B695D" font-size="14">Generate answers with numbered graph evidence</text>
    <circle cx="48" cy="268" r="4" fill="#8B9BD5"/><text x="62" y="274" fill="#4B695D" font-size="14">Run controlled tools with checkpoints and approval</text>

    <rect x="42" y="301" width="207" height="34" rx="17" fill="#EAF8F0" stroke="#C5E8D4"/><text x="145.5" y="323" text-anchor="middle" fill="#2A875F" font-size="13" font-weight="700">Repository &amp; evaluation  →</text>
  </g>

  <g transform="translate(408 34)">
    <rect width="308" height="250" rx="20" fill="#FFFFFF" fill-opacity=".7" stroke="#D8EAE1"/><rect width="308" height="250" rx="20" fill="url(#dots)"/>
    <path d="M70 58L153 38L233 73L256 142L209 208L122 218L54 165L70 58Z" fill="none" stroke="#86CFAE" stroke-width="1.7"/>
    <path d="M153 38L122 218M233 73L54 165M70 58L256 142M209 208L153 38" fill="none" stroke="#9EDCC8" stroke-width="1.2"/>
    <g fill="#FFFFFF" stroke="#5FBC91" stroke-width="1.8"><circle cx="70" cy="58" r="10"/><circle cx="153" cy="38" r="12"/><circle cx="233" cy="73" r="10"/><circle cx="256" cy="142" r="11"/><circle cx="209" cy="208" r="12"/><circle cx="122" cy="218" r="10"/><circle cx="54" cy="165" r="11"/><circle cx="154" cy="137" r="22" fill="#F1FBF5"/></g>
    <g fill="#428565" font-family="Segoe UI,Arial,sans-serif" font-size="8.5" text-anchor="middle"><text x="70" y="61">Crop</text><text x="153" y="41">Pest</text><text x="233" y="76">MoA</text><text x="256" y="145">Risk</text><text x="209" y="211">Agent</text><text x="122" y="221">Product</text><text x="54" y="168">AI</text><text x="154" y="140" font-size="10" font-weight="700">Neo4j</text></g>
  </g>

  <g font-family="Segoe UI,Arial,sans-serif">
    <rect x="408" y="300" width="92" height="36" rx="12" fill="#FFFFFF" stroke="#D8EAE1"/><text x="454" y="315" text-anchor="middle" fill="#789087" font-size="8.5" font-weight="700">NODES</text><text x="454" y="328" text-anchor="middle" fill="#245C47" font-size="12.5" font-weight="750">22,328</text>
    <rect x="510" y="300" width="98" height="36" rx="12" fill="#FFFFFF" stroke="#D8EAE1"/><text x="559" y="315" text-anchor="middle" fill="#789087" font-size="8.5" font-weight="700">RELATIONS</text><text x="559" y="328" text-anchor="middle" fill="#245C47" font-size="12.5" font-weight="750">145,579</text>
    <rect x="618" y="300" width="98" height="36" rx="12" fill="#FFFFFF" stroke="#D8EAE1"/><text x="667" y="315" text-anchor="middle" fill="#789087" font-size="8.5" font-weight="700">REGRESSION</text><text x="667" y="328" text-anchor="middle" fill="#245C47" font-size="12.5" font-weight="750">500 + 50</text>
  </g>
</svg>
