<svg xmlns="http://www.w3.org/2000/svg" width="900" height="278" viewBox="0 0 900 278" role="img" aria-labelledby="title desc">
  <title id="title">Qinglong Ge — AI systems portfolio</title>
  <desc id="desc">A fresh editorial banner with airy human-object interaction and knowledge graph illustrations.</desc>
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#FCFEFF"/><stop offset=".5" stop-color="#F7FBFF"/><stop offset="1" stop-color="#F1FBF6"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#79B8FF"/><stop offset=".5" stop-color="#91D6E2"/><stop offset="1" stop-color="#83D6AE"/>
    </linearGradient>
    <radialGradient id="blue"><stop stop-color="#B9DCFF" stop-opacity=".7"/><stop offset="1" stop-color="#B9DCFF" stop-opacity="0"/></radialGradient>
    <radialGradient id="mint"><stop stop-color="#BDEED6" stop-opacity=".62"/><stop offset="1" stop-color="#BDEED6" stop-opacity="0"/></radialGradient>
    <pattern id="dots" width="18" height="18" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#9CB2C5" fill-opacity=".14"/></pattern>
  </defs>

  <rect width="900" height="278" rx="30" fill="url(#paper)"/>
  <rect x=".75" y=".75" width="898.5" height="276.5" rx="29.25" fill="none" stroke="#DCE8EF" stroke-width="1.5"/>
  <circle cx="720" cy="84" r="172" fill="url(#mint)"/><circle cx="588" cy="250" r="145" fill="url(#blue)"/>
  <rect x="520" width="380" height="278" fill="url(#dots)" opacity=".8"/>

  <g font-family="Segoe UI,Arial,sans-serif">
    <text x="58" y="50" fill="#5A7892" font-size="11.5" font-weight="700" letter-spacing="2.8">QINGLONG GE · AI SYSTEMS PORTFOLIO</text>
    <text x="58" y="108" fill="#15324A" font-size="46" font-weight="750">Research ideas,</text>
    <text x="58" y="156" fill="#15324A" font-size="46" font-weight="750">built into systems.</text>
    <rect x="58" y="176" width="176" height="4" rx="2" fill="url(#accent)"/>
    <text x="58" y="207" fill="#567083" font-size="16">Diffusion · Knowledge Graphs · Stateful Agents</text>
    <text x="58" y="238" fill="#7B8F9E" font-size="12.5">M.S. @ Dalian University of Technology</text>
  </g>

  <g fill="none" stroke-linecap="round">
    <rect x="572" y="61" width="74" height="135" rx="12" fill="#FFFFFF" fill-opacity=".45" stroke="#FF9B9F" stroke-width="2"/>
    <rect x="612" y="128" width="135" height="83" rx="12" fill="#FFFFFF" fill-opacity=".42" stroke="#F6BD72" stroke-width="2"/>
    <rect x="688" y="70" width="55" height="69" rx="12" fill="#FFFFFF" fill-opacity=".45" stroke="#75CFE0" stroke-width="2"/>
    <path d="M627 120C650 105 669 104 696 110" stroke="#75CFE0" stroke-width="2"/>
    <path d="M629 146C653 163 675 168 704 173" stroke="#F6BD72" stroke-width="2"/>
    <circle cx="627" cy="120" r="4" fill="#FF9B9F" stroke="none"/><circle cx="696" cy="110" r="4" fill="#75CFE0" stroke="none"/><circle cx="704" cy="173" r="4" fill="#F6BD72" stroke="none"/>
  </g>

  <g opacity=".85" stroke-linecap="round">
    <path d="M744 42L801 65L843 116L820 173L765 208L719 172L704 116L744 42Z" fill="none" stroke="#74C9A4" stroke-width="1.6"/>
    <path d="M801 65L765 208M843 116L719 172M744 42L820 173" fill="none" stroke="#8FD9C4" stroke-width="1.2"/>
    <g fill="#FFFFFF" stroke="#69C69E" stroke-width="1.7"><circle cx="744" cy="42" r="7"/><circle cx="801" cy="65" r="9"/><circle cx="843" cy="116" r="7"/><circle cx="820" cy="173" r="9"/><circle cx="765" cy="208" r="8"/><circle cx="719" cy="172" r="7"/><circle cx="704" cy="116" r="9"/></g>
  </g>
</svg>
